name: Test Instagram Usernames

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        run: |
          printf '2\nusernames.txt\n3\nn\n' | python checker.py

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: username-results
          path: output/instagram-usernames/
          if-no-files-found: warn
